name: Build assignments

on:
  push:
    branches: [main]
    paths:
      - "assignments/**"
      - "template/**"
      - "config.json"
      - "Dockerfile"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Typst image
        run: docker build -t typst-local .

      - name: Compile assignments
        run: |
          set -euo pipefail
          mkdir -p dist

          # Identity for the output filenames comes from config.json.
          reg_no=$(jq -r '.reg_no // ""' config.json)
          author=$(jq -r '.author // ""' config.json)
          # Slugify for a safe filename: non-alphanumerics -> "_", trimmed.
          slugify() { echo "$1" | sed -E 's/[^[:alnum:]]+/_/g; s/^_+//; s/_+$//'; }
          reg_slug=$(slugify "$reg_no")
          author_slug=$(slugify "$author")

          # One Markdown table per kind for the README, built as we go.
          theory_table=dist/theory.md
          lab_table=dist/lab.md
          header='| # | Assignment | Download |\n| :-- | :-- | :-- |\n'
          printf "$header" > "$theory_table"
          printf "$header" > "$lab_table"

          find assignments -type f -name main.typ | sort | while read -r f; do
            dir=$(dirname "$f")
            slug=$(basename "$dir")

            # Assignment number: leading digits of the folder (02-foo -> 02),
            # falling back to the number field inside main.typ.
            no=$(echo "$slug" | grep -oE '^[0-9]+' || true)
            if [ -z "$no" ]; then
              no=$(sed -n 's/.*number:[[:space:]]*"[^0-9]*\([0-9]\+\).*/\1/p' "$f" | head -1 || true)
            fi
            no=${no:-00}

            title=$(sed -n 's/.*title:[[:space:]]*"\([^"]*\)".*/\1/p' "$f" | head -1 || true)
            [ -z "$title" ] && title="$slug"

            # Kind drives the per-subject config below: a main.typ `kind:` wins,
            # else infer it from the folder.
            kind=$(sed -n 's/.*kind:[[:space:]]*"\([^"]*\)".*/\1/p' "$f" | head -1 || true)
            if [ -z "$kind" ]; then
              case "$dir" in assignments/lab/*) kind="Lab" ;; *) kind="Theory" ;; esac
            fi

            # Subject name and code, most specific first: a per-document override
            # in main.typ, else the per-kind entry under `kinds` in config.json,
            # else the top-level config value.
            course=$(sed -n 's/.*course:[[:space:]]*"\([^"]*\)".*/\1/p' "$f" | head -1 || true)
            [ -z "$course" ] && course=$(jq -r --arg k "$kind" '.kinds[$k].course // .course // ""' config.json)
            code=$(sed -n 's/.*course_code:[[:space:]]*"\([^"]*\)".*/\1/p' "$f" | head -1 || true)
            [ -z "$code" ] && code=$(jq -r --arg k "$kind" '.kinds[$k].course_code // .course_code // ""' config.json)
            course_slug=$(slugify "$course")
            code_slug=$(slugify "$code")

            # <reg_no>_<name>_<course>_<course_code>_<assignment_no>.pdf.
            # Empty fields are skipped so the name never has a double underscore.
            base=""
            for part in "$reg_slug" "$author_slug" "$course_slug" "$code_slug" "$no"; do
              [ -n "$part" ] || continue
              base="${base:+${base}_}${part}"
            done
            out="${base}.pdf"
            # Guarantee uniqueness if two assignments share a number.
            if [ -e "dist/$out" ]; then
              echo "::warning::duplicate assignment number '$no'; disambiguating $f with its folder name"
              out="${base}_${slug}.pdf"
            fi

            echo "::group::compile $out"
            docker run --rm -v "$PWD:/work" -w /work typst-local \
              compile --root /work "$f" "dist/$out"
            echo "::endgroup::"

            # Route the row to the Theory or Lab table by its folder.
            case "$dir" in
              assignments/lab/*) row_table="$lab_table" ;;
              *)                 row_table="$theory_table" ;;
            esac
            printf '| %s | %s | [PDF](../../releases/download/latest/%s) |\n' \
              "$no" "$title" "$out" >> "$row_table"
          done

          # `while` ran in a subshell, so recheck each table from its file.
          if [ "$(wc -l < "$theory_table")" -le 2 ]; then
            printf '_None yet. Add one under `assignments/theory/`._\n' > "$theory_table"
          fi
          if [ "$(wc -l < "$lab_table")" -le 2 ]; then
            printf '_None yet. Add one under `assignments/lab/`._\n' > "$lab_table"
          fi

      - name: Upload artifacts
        if: ${{ hashFiles('dist/*.pdf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: dist/*.pdf

      - name: Publish rolling release
        if: ${{ hashFiles('dist/*.pdf') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)." \
            dist/*.pdf

      - name: Update download tables in README
        run: |
          set -euo pipefail
          [ -f dist/theory.md ] || exit 0

          python3 - <<'PY'
          import pathlib
          readme_path = "README.md"
          blocks = [("THEORY", "dist/theory.md"), ("LAB", "dist/lab.md")]
          readme = pathlib.Path(readme_path).read_text()
          original = readme
          for name, table_path in blocks:
              start, end = f"<!-- {name}:START -->", f"<!-- {name}:END -->"
              i, j = readme.find(start), readme.find(end)
              if i == -1 or j == -1:
                  continue  # marker missing; leave that block alone
              table = pathlib.Path(table_path).read_text().strip("\n")
              readme = readme[: i + len(start)] + "\n\n" + table + "\n\n" + readme[j:]
          if readme != original:
              pathlib.Path(readme_path).write_text(readme)
          PY

          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: refresh assignment downloads [skip ci]"
            git push
          fi
